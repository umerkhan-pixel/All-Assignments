   <style>
        **{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
    overflow-x:hidden;
    position:relative;
    background:#080808;
}

/* Spider-Man Background */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 20% 20%,rgba(255,0,0,.35),transparent 35%),
    radial-gradient(circle at 80% 25%,rgba(0,119,255,.35),transparent 35%),
    radial-gradient(circle at 50% 90%,rgba(180,0,0,.3),transparent 40%);
    filter:blur(80px);
    animation:bgMove 12s ease-in-out infinite alternate;
    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    background:
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(135deg,#060606,#120000,#001b3d,#060606);
    background-size:45px 45px,45px 45px,100% 100%;
    z-index:-3;
}

@keyframes bgMove{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.15);
    }
}

/* Glass Card */

.container{
    width:100%;
    max-width:900px;
    padding:45px;
    border-radius:30px;
    background:rgba(15,15,15,.78);
    backdrop-filter:blur(18px);
    border:2px solid rgba(255,0,0,.3);
    box-shadow:
    0 0 25px rgba(255,0,0,.25),
    0 0 60px rgba(0,102,255,.18),
    inset 0 0 15px rgba(255,255,255,.05);
    animation:fade .8s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Heading */

h1{
    text-align:center;
    font-size:48px;
    margin-bottom:35px;
    font-weight:700;
    letter-spacing:2px;
    color:#fff;
    text-shadow:
    0 0 10px #ff0000,
    0 0 25px #ff0000,
    0 0 45px #0066ff;
}

/* Buttons */

a{
    display:flex;
    justify-content:space-between;
    align-items:center;
    text-decoration:none;
    color:#fff;
    margin:18px 0;
    padding:18px 24px;
    border-radius:18px;
    background:linear-gradient(135deg,#990000,#330000);
    border:1px solid rgba(255,255,255,.08);
    position:relative;
    overflow:hidden;
    transition:.45s;
    font-size:20px;
    font-weight:600;
    box-shadow:0 12px 25px rgba(0,0,0,.4);
}

/* Shiny Effect */

a::before{
    content:"";
    position:absolute;
    top:0;
    left:-130%;
    width:60%;
    height:100%;
    background:rgba(255,255,255,.35);
    transform:skewX(-25deg);
    transition:.7s;
}

a:hover::before{
    left:150%;
}

/* Arrow */

a::after{
    content:"🕷";
    font-size:22px;
    transition:.4s;
}

a:hover::after{
    transform:rotate(360deg) scale(1.2);
}

/* Hover */

a:hover{
    background:linear-gradient(135deg,#ff0000,#004cff);
    transform:translateX(12px) scale(1.03);
    box-shadow:
    0 0 20px #ff0000,
    0 0 35px #004cff,
    0 20px 40px rgba(0,0,0,.45);
}

/* Active */

a:active{
    transform:scale(.98);
}

/* Scrollbar */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#ff0000;
    border-radius:10px;
}

/* Mobile */

@media(max-width:768px){

    body{
        padding:20px;
    }

    .container{
        padding:25px;
    }

    h1{
        font-size:34px;
    }

    a{
        font-size:17px;
        padding:15px 18px;
    }
}
