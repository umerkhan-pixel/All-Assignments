<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Countdown</title>
</head>
<body>

    <h1>Event Countdown and Duration Calculator</h1>

<label>Today's Date</label><br>
<input type="date", id="todayInput"/><br><br>

<label>Event's Date</label><br>
<input type="date", id="eventInput"/><br><br>

<button id="calculateBtn">Calculate Remaining Time</button>
<div id="result"></div>

</body>

<script>
    let todayInput = document.getElementById("todayInput")
    let eventInput = document.getElementById("eventInput")
    let calculateBtn = document.getElementById("calculateBtn")
    let result = document.getElementById("result")

    let calculateRemaingTime = () => {
        result.innerHTML = ""

        let today = todayInput.value
        let event = eventInput.value
        
        let todayDate = new Date (today)
        let eventDate = new Date (event)

        let todayMilliseconds = todayDate.getTime()
        let eventMilliseconds = eventDate.getTime()

        let milliseconds = eventMilliseconds - todayMilliseconds

        let seconds = milliseconds / 1000
        let minutes = milliseconds / 1000 / 60 
        let hours = milliseconds / 1000 / 60 / 60 
        let days = milliseconds / 1000 / 60 / 60 / 24 
        let months = milliseconds / 1000 / 60 / 60 / 24 / 30
        let years = milliseconds / 1000 / 60 / 60 / 24 / 30 / 12

        result.innerHTML += "<p> Milliseconds : " + milliseconds + "</p>"
        result.innerHTML += "<p> Seconds : " + seconds + "</p>"
        result.innerHTML += "<p> Minutes : " + minutes + "</p>"
        result.innerHTML += "<p> Hours : " + hours + "</p>"
        result.innerHTML += "<p> Days : " + days + "</p>"
        result.innerHTML += "<p> Months : " + months + "</p>"
        result.innerHTML += "<p> Yearss : " + years + "</p>"
    }
    calculateBtn.addEventListener("click", calculateRemaingTime)

</script>
</html>
